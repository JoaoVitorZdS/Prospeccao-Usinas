<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WattScout</title>
<meta name="description" content="WattScout — CRM de prospecção do setor de energia: usinas de geração distribuída, distribuidoras e intermediadores.">
<meta name="theme-color" content="#063940">
<meta name="color-scheme" content="light dark">

<!-- CSP como <meta> porque o app é servido como arquivo estático puro (sem
     servidor próprio) — funciona mesmo quando quem hospeda não deixa configurar
     headers HTTP. Em produção (Vercel), vercel.json REPETE isto como header de
     verdade, que é mais forte (cobre coisas que <meta> não cobre, tipo frame-ancestors
     de verdade). connect-src lista só os dois destinos que o app realmente chama
     (enriquecimento de CNPJ, seção 2.3 do plano) — qualquer outro fetch é bloqueado. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self' https://api.opencnpj.org https://brasilapi.com.br https://qgtqkhjazwlakuvqevao.supabase.co;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  frame-ancestors 'none';
  manifest-src 'self';
">
<!-- X-Content-Type-Options, X-Frame-Options, Referrer-Policy e Permissions-Policy
     só funcionam como HEADER HTTP de verdade, nunca como <meta> — por isso não
     estão aqui e sim em vercel.json (ver SETUP.md). -->


<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WattScout">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="vendor/zendesk-garden/css-variables.css">
<link rel="stylesheet" href="css/wattscout.css">
</head>
<body>
<!-- A barra lateral (.rail), a barra superior (.topo) e as rotas (#conteudo) são montadas por js/app.js.
     Ver SETUP.md para como rodar localmente — precisa de servidor HTTP, não file://. -->
<main id="conteudo" aria-live="polite" aria-busy="true">
  <div class="carregando">Carregando WattScout…</div>
</main>

<noscript>
  <div class="erro-fatal">
    <h1>JavaScript necessário</h1>
    <p>O WattScout é um app de página única e precisa de JavaScript habilitado.</p>
  </div>
</noscript>

<!-- supabase-js vendorado (não CDN — mantém script-src 'self' na CSP acima).
     Script clássico, carrega e executa ANTES do módulo abaixo, então
     `window.supabase` já existe quando js/db.js chama abrir(). -->
<script src="vendor/supabase-js-2.112.3.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
